name: TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/transsion-graveyard/recovery_device_itel_P1102GT'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/itel/P1102GT'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'P1102GT'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_P1102GT'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Display Run Parameters
      run: |
        echo "::group::Build Parameters"
        echo "Manifest URL: ${{ inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ inputs.DEVICE_TREE_URL }} (${{ inputs.DEVICE_TREE_BRANCH }})"
        echo "Device: ${{ inputs.DEVICE_NAME }} @ ${{ inputs.DEVICE_PATH }}"
        echo "Target: ${{ inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Cache AOSP source
      id: aosp-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/workspace
        key: aosp-${{ inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          aosp-${{ inputs.MANIFEST_BRANCH }}-

    - name: Cache ccache
      id: ccache-cache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ inputs.MANIFEST_BRANCH }}-

    - name: Prepare environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(inputs.MANIFEST_URL, 'git@github.com') || startsWith(inputs.DEVICE_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -sS https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      if: steps.aosp-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        repo init --depth=1 -u ${{ inputs.MANIFEST_URL }} -b ${{ inputs.MANIFEST_BRANCH }}
      working-directory: ${{ github.workspace }}

    - name: Repo Sync
      if: steps.aosp-cache.outputs.cache-hit != 'true'
      run: |
        repo sync -c -j$(nproc --all) --force-sync
      working-directory: ${{ github.workspace }}/workspace

    - name: Clone device tree
      run: |
        mkdir -p ${{ inputs.DEVICE_PATH }}
        REMOTE_COMMIT=$(git ls-remote ${{ inputs.DEVICE_TREE_URL }} ${{ inputs.DEVICE_TREE_BRANCH }} | cut -f1)
        if [ ! -f "${{ inputs.DEVICE_PATH }}/Android.mk" ] || [ "$(git -C ${{ inputs.DEVICE_PATH }} rev-parse HEAD 2>/dev/null)" != "$REMOTE_COMMIT" ]; then
          rm -rf ${{ inputs.DEVICE_PATH }}
          git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        fi
      working-directory: ${{ github.workspace }}/workspace

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Configure ccache
      run: |
        export CCACHE_DIR=~/.ccache
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 10G
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV

    - name: Building recovery
      run: |
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        export CCACHE_EXEC=/usr/bin/ccache
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ inputs.MAKEFILE_NAME }}-eng
        make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ github.workspace }}/workspace

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*.img
        name: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Device: ${{ inputs.DEVICE_NAME }}
          Target: ${{ inputs.BUILD_TARGET }}.img
